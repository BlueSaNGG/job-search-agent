name: Deploy evening trigger
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-evening-trigger.yml'
      - 'src/cloudflare/trigger.ts'
      - 'wrangler.trigger.jsonc'

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: deploy-evening-trigger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Deploy Worker with dispatch credential
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKER_DEPLOY_TOKEN || secrets.CF_API_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.JOB_ALERTS_DISPATCH_TOKEN }}
        run: |
          set -eu
          : "${CLOUDFLARE_ACCOUNT_ID:?Set CF_ACCOUNT_ID}"
          : "${CLOUDFLARE_API_TOKEN:?Set CF_WORKER_DEPLOY_TOKEN or CF_API_TOKEN}"
          : "${DISPATCH_TOKEN:?Set JOB_ALERTS_DISPATCH_TOKEN}"
          umask 077
          credentials=$(mktemp "$RUNNER_TEMP/worker-secrets.XXXXXX.json")
          trap 'rm -f "$credentials"' EXIT
          jq -n '{GITHUB_TOKEN: env.DISPATCH_TOKEN}' > "$credentials"
          unset DISPATCH_TOKEN
          npm run deploy:trigger -- --secrets-file "$credentials"
