name: Live source smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: '33 14 * * 1'  # weekly Monday UTC; independent of the daily email scan
  pull_request:
    paths:
      - '.github/workflows/source-smoke.yml'
      - 'src/core/discover/**'
      - 'src/node/check-companies.ts'
      - 'package.json'


permissions:
  contents: read

jobs:
  verify-new-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Check eight new public ATS boards
        run: npm run check-companies -- drw imc airwallex anyscale hightouch modal fireworks crusoe
