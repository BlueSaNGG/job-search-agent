name: Deploy leaderboard
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/index.html']
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    continue-on-error: ${{ github.workflow == 'Job alerts' }}
    runs-on: ubuntu-latest
    concurrency:
      group: leaderboard-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deploy
